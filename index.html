<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · FIRA</title>
  <!-- Sengaja belum ada CSS: tahap ini hanya struktur semantik (setara wireframe lo-fi, IMK 05). -->
</head>
<body>

  <!-- ZONA ATAS: identitas aplikasi. Belum ada sesi pengguna, jadi belum ada <nav>. -->
  <header>
    <span>FIRA</span>
  </header>

  <main>
    <!-- Panel identitas: judul halaman + slogan -->
    <section aria-labelledby="judul-aplikasi">
      <h1 id="judul-aplikasi">FIRA</h1>
      <p>FILKOM Integrated Resource Access</p>
      <p>So Easy, It Just Needs a Tap</p>
    </section>

    <!-- Panel masuk: satu aksi utama saja (Hick: n = 1) -->
    <section aria-labelledby="judul-masuk">
      <h2 id="judul-masuk">Masuk dengan akun UB</h2>
      <!-- SSO = berpindah ke layanan lain, jadi <a>, bukan <button>. Di demo ini langsung ke dashboard. -->
      <a href="dashboard.html">SSO Universitas Brawijaya</a>
    </section>
  </main>

  <footer>
    <p>Butuh bantuan? · Kontak admin peminjaman</p>
  </footer>

</body>
</html>
